note = "the only unlock argv twine builds (twine.bale.unlock_argv; read by `twine kill` and the Arc 2 loop's closure): the sid always explicit (without one bale closes whichever single session is open), the reason always aborted (without one bale infers closed-read-only or abandoned), no other flag — never the one that clears the lock past a HOLD branch — and never a retry. Recorded at 0.4.49 and again at 0.4.51 (by twine-051-record, the sid 2026-10-08-sc-002): the `aborted` close of the scratch session (the fixture), its HOLD-branch refusal just before (reason hold-branch, after a response had been staged to bale/<sid>), the not-open and integration-json refusals in ~/twine-src, the closed-read-only close of the read-only session and the no-op — the recordings that replace session 5b's doubles (contract §14.7). Exit and stdout tell a close from a refusal (ok only on exit 0 with outcome unlocked, sid the session and closure_reason aborted); on a refusal twine also reads the recorded line as it stands (outcome unlock-refused, closure_reason null), and keys its one hand-line decision on that line's `reason` (since session 2026-10-07-twine-kill-reason-002): bale's own remedy, `bale revert <sid>`, which twine never runs, exactly when the outcome is unlock-refused and the reason hold-branch, the unlock line otherwise. Twine reads no stderr text; stderr is reported and passed through. Recorded at 0.4.51 with every recording's stderr byte-exact (the lines unchanged; the two ~/twine-src refusals differ from 0.4.49's only in the sid and in open_sessions naming the sitting open then), so the `stdout` sentence's stderr clause is recorded fact now: each refusal's stderr ends with `[bale] error: <message>` and a newline, the line's own `message` (the HOLD refusal's is preceded by bale's `[bale] unlock: <sid>` progress line), and the tests replay those bytes. The vocabulary named is closure_reason's; the refusal's reason set is `reasons`"

