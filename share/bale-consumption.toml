# share/bale-consumption.toml — twine's consumption manifest (twine-seed.md
# D3, D4; T10). Beside the floor and the schema hashes, exactly which bale
# surfaces twine reads and which keys of each, so a bale that moves is a
# mechanical diff of this file against bale's changelog since the floor.
# Every key twine does not list here is a key bale can change for free;
# every key it does list is checked present on the line twine reads
# (twine.bale.missing_keys_failure — D2 as amended, below).
#
# Landed by session 2026-10-01-twine-core-002 against bale 0.4.45 as
# installed on the architect's machine (probe twine-core-fixtures,
# 2026-10-01). Moved to bale 0.4.49 by session 2026-10-07-twine-pin-049-001
# (three probes on 2026-10-07 — twine-049-fixtures, twine-049-scratch,
# twine-049-emissions — and the desk's reading of bale-src's context
# tarball; fixtures/README.md, "bale 0.4.49"). Moved to bale 0.4.51 by
# session 2026-10-12-twine-pin-051-001, by one probe: twine-051-record
# (2026-10-08), the recorder bin/twine-record-fixtures now is, whose
# paste-back bin/twine-land-recordings landed — twenty-four recordings,
# stdout and stderr (fixtures/README.md, "bale 0.4.51") — beside the
# desk's reading of bale-src's context tarball. That was the last exact
# pin: session 2026-10-12-twine-pin-floor-002 made it a floor plus this
# file's key-and-schema contract (D2 as amended at sitting
# 2026-10-08-open-arc2-003): twine drives any bale at or above the floor
# (below) whose installed schemas/ hash as the table below pins them, and every verb
# that reads a bale --json line checks, on that line, the keys its
# [[surface]] lists. A bale that moves without touching a listed key or a
# pinned schema needs nothing here (0.4.52 was the first such, admitted
# with nothing re-recorded); one that does needs a recording session, which
# raises the floor. twine.bale.load_manifest parses it; tests/ walk it.
#
# Entry shape, [[surface]]:
#   kind             "file" (a path under the install root twine reads),
#                    "verb" (a bale verb twine runs non-interactively), or
#                    "format" (a text format bale emits and twine parses
#                    out of a paste — added by session
#                    2026-10-02-twine-take-read-001)
#   path             kind = file: the path under <root>
#   verb, flags      kind = verb: the verb and the flags twine passes
#                    (flag names only; argv carries the exact invocation)
#   argv             kind = verb: the exact argument vector after `bale`; a
#                    per-run value is written `<role>` (`<sid>`, `<tarball>`,
#                    `<file>`, `<bundle>`, `<goal>`) and names its fixture by
#                    role (fixtures/README.md, "Per-run values" — session
#                    2026-10-03-twine-carry-bale-002)
#   cwd              kind = verb: where the recording ran, which is where the
#                    fixture sits ("repo" = the packing repo, ~/twine-src;
#                    "scratch" = the throwaway repository a probe recorded
#                    in — a repo whose session it was, as twine's --cwd is;
#                    "anywhere" = the output depends on no directory)
#   stdout           what twine expects on stdout
#   keys             the JSON keys twine reads from that output — [] where
#                    twine reads none yet
#   key_owner        where bale documents that surface's key contract
#   read_by          the twine verb(s) that read it (registered verb names;
#                    `carry probe` reads the probe it runs and the
#                    probe-output it verifies — session 2026-10-02-twine-carry-probe-002)
#   fixture          the recorded output under fixtures/, when one exists —
#                    named by the rule, its outcome group included when the
#                    argv was recorded with more than one outcome
#                    (fixtures/README.md, "Outcome groups")
#   also_recorded    kind = verb, optional: further recordings of the verb —
#                    another outcome of the same argv, or another argv of it
#                    — each an inline table {argv, cwd, outcome, reason (when
#                    the line has one), fixture}; the tests replay them where
#                    twine's one argv would meet that outcome (session
#                    2026-10-07-twine-pin-049-001)
#   stand_in         kind = verb with no fixture: the recorded bytes the
#                    tests replay in its place, and why they may (none
#                    since session 2026-10-08-twine-carry-exchange-json-001
#                    retired the flagless relay surface and its stand-in;
#                    the shape stays for the next such gap)
#   doubles          the test doubles standing in for this surface's
#                    unrecorded outputs; a later recording replaces them
#   unrecorded       kind = verb with neither a fixture nor a stand_in: why
#                    nothing is recorded yet and what will record it; the
#                    doubles alone stand in (session 2026-10-04-twine-kill-switch-002)
#   read_at          optional: the probe(s) that read the surface's contract
#                    from bale's source, when no output is recorded
#   vocabulary       kind = verb, optional: the [[vocabulary]] entry (by its
#                    `axis`) whose values the key twine reads from this
#                    output takes — `apply`'s `outcome` is `apply-outcome`
#                    (session 2026-10-03-twine-transitions-004)
#   reasons          kind = verb, optional: a closed set one of the surface's
#                    keys takes that is NOT a transition-table axis (the
#                    unlock refusal's `reason`; since 0.4.51 the relay
#                    refusal's too), with its home in `reasons_home`
#   written_against  the bale version the entry was written against
#
#   kind = format carries, instead of path/verb/argv/cwd/stdout/fixture:
#   format           the block kind `twine take` reports ("probe",
#                    "probe-output", "light", "exchange", "relay")
#   locator          how the block is found in text (its whole-line sentinels)
#   home             where bale specifies and emits it: the TARBALL.md
#                    section and the bale source function(s), read by probe
#   emitted_by       what prints it
#   fixtures         the recorded or carried emissions under fixtures/
#   fixtures_version the bale version that emitted those files: the floor
#                    for a crafter emission (re-recorded when the crafter's
#                    sha256 moves; the floor until session
#                    2026-10-12-twine-pin-floor-002 said "at every pin"), the
#                    version that printed a carried paste, which stays under
#                    that version's directory when the floor moves
#                    (tests/helpers.py carried_relpath reads it here)
#   keys             for a JSON-bodied format, the record keys twine reads
#
# A recording session diffs the format entries too (D3 names the bundle format
# among the surfaces): a changed sentinel, trailer or body serialization
# is a changed surface even though no verb's --json moved.
#
# [[wanted]] names a surface a later session needs and the bale at the
# floor does not have — so the gap is data, not a sentence in a brief. Shape:
#   verb, flags      the surface wanted
#   needed_by        the twine session or verb that needs it, and why
#   status           what the bale at the floor does instead
# No [[wanted]] entry remains at 0.4.49 or 0.4.51: the three the 0.4.45
# manifest carried (`open --json`, `relay --json`, a reason-coded `unlock
# --json` refusal) landed in bale-src at twine's asking (0.4.47, 0.4.48) and
# are [[surface]] entries below. The shape stays for the next gap.
#
# [[vocabulary]] (session 2026-10-03-twine-transitions-004) is a closed set
# of spellings bale declares, recorded as data so a recording session diffs them
# mechanically (D4). The transition table (share/transitions.toml) keys
# its three bale axes on exactly these values; `twine transitions` names
# any value without a row. Entry shape:
#   axis             the transition-table axis these values are the keys of
#   values           bale's spellings, in the order bale declares them
#   home             the installed file that declares them: a schema under
#                    schemas/ (its sha256 is pinned in [bale.schemas]), or a
#                    bale source file
#   home_sha256      kind of home = a source file: its sha256 as read
#   pointer          where in `home`: a JSON pointer to the enum, or the
#                    function whose docstring owns the vocabulary
#   also_at          other places in `home` carrying the same values
#   excluded         enum members that are not keys, each with why
#   read_by          the twine verb(s) that read the values
#   written_against  the bale version the values were read from
#   read_at          the probe(s) or readings that read them, never recalled

# The floor (D2 as amended, session 2026-10-12-twine-pin-floor-002): the
# lowest bale twine drives — the version the recordings under fixtures/
# were made at, so fixtures/bale-<floor>/ is their directory — raised only
# by a recording session. Compared to <root>/bin/VERSION as three dotted
# integers (a tuple: 0.4.100 is above 0.4.51). The key was `pin`, an exact
# version, until that session; twine no longer reads it.
[bale]
floor = "0.4.51"

# The gate's second half: sha256 of each schema file as installed
# (<root>/schemas/*.json). An install at or above the floor is driven only
# when every file below is there with this hash, which holds the two
# schema-homed vocabularies fixed; the files themselves are under
# fixtures/bale-0.4.51/schemas/ (landed byte-exact by session
# 2026-10-12-twine-pin-floor-002 from bale-src's context tarball of
# 2026-10-07 at 0.4.51; probe twine-floor-schemas hashed the operator's
# 0.4.52 install's on 2026-10-12, all eight equal). Read at bale
# 0.4.45 by probe twine-core-fixtures (2026-10-01); UNCHANGED at 0.4.49 —
# the desk of sitting 2026-10-06-continue-twine-002 hashed 0.4.49's eight
# schemas/*.json from bale-src's context tarball on 2026-10-07 and every
# one equals the value below — and UNCHANGED at 0.4.51, re-hashed this time
# by a probe: twine-051-record (2026-10-08) hashed the eight installed
# files at /home/chordsphere/bale/schemas and every one equals the value
# below, so the values stand and the two schema-homed vocabularies below
