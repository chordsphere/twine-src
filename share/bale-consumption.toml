stdout = "exactly one JSON object line; '[bale] ' lines go to stderr; exit 0 on a successful read"
keys = []
key_owner = "format_status_json docstring in bin/bale_report.py (outcome, version, sid, repo, session, staging, outbox, applied, sessions, scopes, integration_lock, config)"
read_by = []
