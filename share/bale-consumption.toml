# --- the vocabularies the transition table keys on (session 2026-10-03-twine-transitions-004) ---
# Read by the probes twine-table-vocab and twine-apply-vocab (2026-10-03,
# bale 0.4.45 at /home/chordsphere/bale; all eight schemas hashed to the
# pins above), copied from their output, never recalled.

[[vocabulary]]
axis = "telemetry-outcome"
values = ["opened", "applied", "held", "reverted", "rejected", "bailout", "scope-drift-refused", "required-check-refused", "base-drift-refused", "unlocked", "rolled-back", "re-applied", "relay-refused"]
home = "schemas/telemetry-record.schema.json"
pointer = "/properties/outcome"
also_at = ["/properties/attempts/items/properties/outcome"]
excluded = []
read_by = ["transitions"]
written_against = "0.4.45"
read_at = ["twine-table-vocab"]
note = "the outcome of each telemetry attempt, mirrored to the envelope. 'rejected' is written when apply exits non-zero through an error path (bin/bale_apply.py:3901-3905) and 'relay-refused' when bale relay does (bin/bale_relay.py:204-209); 'unlocked' is the registry-close outcome whatever command drove it, its closure_reason saying why"

[[vocabulary]]
axis = "closure-reason"
values = ["abandoned", "superseded-by-split", "reframed-after-clarification", "master-closeout", "crash-debris", "closed-read-only", "no_response", "malformed_response", "aborted"]
home = "schemas/telemetry-record.schema.json"
pointer = "/properties/attempts/items/properties/closure_reason"
also_at = []
excluded = ["null: the enum's tenth member, meaning the session is not closed; not a reason, so not a key"]
read_by = ["transitions"]
written_against = "0.4.45"
read_at = ["twine-table-vocab"]
note = "why a session closed, stamped on unlock and revert events; `bale unlock --help` lists the same nine as --reason choices, and an omitted reason infers 'closed-read-only' for an empty recorded scope, 'abandoned' otherwise. Two spell with underscores (no_response, malformed_response); bale's spelling is the key"

[[vocabulary]]
axis = "apply-outcome"
values = ["applied", "held", "reverted", "bailout", "clarification", "dry-run", "scope-drift-refused", "required-check-refused", "base-drift-refused"]
home = "bin/bale_report.py"
home_sha256 = "7af2f7aca3082160dbf45849d91f28bac926c3d31ee7c1bc123f3fcba7e0759b"
pointer = "format_apply_json docstring (line 2279), the `outcome` block"
also_at = ["`bale apply --help`, the --json text"]
excluded = []
read_by = ["transitions"]
written_against = "0.4.45"
read_at = ["twine-apply-vocab"]
note = "the outcome `bale apply --json` prints, one terminal reporting point each: exit 0 for applied, bailout, clarification and dry-run; exit 1 for held, reverted and the three *-refused (the *-refused also under --dry-run). Error paths print nothing on stdout and exit non-zero (telemetry 'rejected'). With pack's 'packed' bale calls these the whole outcome vocabulary; 'packed' is pack's, not apply's, and is not a key here"
