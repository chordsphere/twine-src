# share/bale-consumption.toml — twine's consumption manifest (twine-seed.md
# D3, D4; T10). Beside the pin, exactly which bale surfaces twine reads,
# so a pin bump is a mechanical diff of this file against bale's
# changelog since the pinned version. Every key twine does not list here
# is a key bale can change for free.
#
# Landed by session 2026-10-01-twine-core-002 against bale 0.4.45 as
# installed on the architect's machine (probe twine-core-fixtures,
# 2026-10-01). twine.bale.load_manifest parses it; tests/ walk it.
#
# Entry shape, [[surface]]:
#   kind             "file" (a path under the install root twine reads),
#                    "verb" (a bale verb twine runs non-interactively), or
#                    "format" (a text format bale emits and twine parses
#                    out of a paste — added by session
#                    2026-10-02-twine-take-read-001)
#   path             kind = file: the path under <root>
#   verb, flags      kind = verb: the verb and the flags twine passes
#                    (flag names only; argv carries the exact invocation)
#   argv             kind = verb: the exact argument vector after `bale`; a
#                    per-run value is written `<role>` (`<sid>`, `<tarball>`)
#                    and names its fixture by role (fixtures/README.md,
#                    "Per-run values" — session 2026-10-03-twine-carry-bale-002)
#   cwd              kind = verb: where it runs ("repo" = the packing repo)
#   stdout           what twine expects on stdout
#   keys             the JSON keys twine reads from that output — [] where
#                    twine reads none yet
#   key_owner        where bale documents that surface's key contract
#   read_by          the twine verb(s) that read it (registered verb names;
#                    `carry probe` reads the probe it runs and the
#                    probe-output it verifies — session 2026-10-02-twine-carry-probe-002)
#   fixture          the recorded output under fixtures/, when one exists
#   stand_in         kind = verb with no fixture: the recorded bytes the
#                    tests replay in its place, and why they may
#   doubles          the test doubles standing in for this surface's
#                    unrecorded outputs; a later recording replaces them
#   vocabulary       kind = verb, optional: the [[vocabulary]] entry (by its
#                    `axis`) whose values the key twine reads from this
#                    output takes — `apply`'s `outcome` is `apply-outcome`
#                    (session 2026-10-03-twine-transitions-004)
#   written_against  the bale version the entry was written against
#
#   kind = format carries, instead of path/verb/argv/cwd/stdout/fixture:
#   format           the block kind `twine take` reports ("probe",
#                    "probe-output", "light", "exchange", "relay")
#   locator          how the block is found in text (its whole-line sentinels)
#   home             where bale specifies and emits it: the TARBALL.md
#                    section and the bale source function(s), read by probe
#   emitted_by       what prints it
#   fixtures         the recorded or carried emissions under fixtures/
#   keys             for a JSON-bodied format, the record keys twine reads
#
# A pin bump diffs the format entries too (D3 names the bundle format
# among the surfaces): a changed sentinel, trailer or body serialization
# is a changed surface even though no verb's --json moved.
#
# [[wanted]] names a surface a later session needs and the pinned bale
# does not have — so the gap is data, not a sentence in a brief.
#
# [[vocabulary]] (session 2026-10-03-twine-transitions-004) is a closed set
# of spellings bale declares, recorded as data so a pin bump diffs them
# mechanically (D4). The transition table (share/transitions.toml) keys
# its three bale axes on exactly these values; `twine transitions` names
# any value without a row. Entry shape:
#   axis             the transition-table axis these values are the keys of
#   values           bale's spellings, in the order bale declares them
#   home             the installed file that declares them: a schema under
#                    schemas/ (its sha256 is pinned in [bale.schemas]), or a
#                    bale source file
#   home_sha256      kind of home = a source file: its sha256 as read
#   pointer          where in `home`: a JSON pointer to the enum, or the
#                    function whose docstring owns the vocabulary
#   also_at          other places in `home` carrying the same values
#   excluded         enum members that are not keys, each with why
#   read_by          the twine verb(s) that read the values
#   written_against  the bale version the values were read from
#   read_at          the probe(s) that read them, never recalled

