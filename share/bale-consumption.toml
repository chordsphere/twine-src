# --- the verbs the carry hand-offs run (session 2026-10-03-twine-carry-bale-002) ---

[[surface]]
kind = "verb"
verb = "apply"
flags = ["--dry-run", "--json"]
argv = ["apply", "--dry-run", "--json", "<tarball>"]
cwd = "repo"
stdout = "exactly one JSON object line; outcome \"dry-run\" when the response would apply (nothing staged, branched or committed)"
keys = ["outcome"]
vocabulary = "apply-outcome"
read_by = ["carry response"]
fixture = "fixtures/bale-0.4.45/twine-src/apply_--dry-run_--json_tarball.json"
doubles = ["tests/test_carry_bale.py BaleDouble: each *-refused outcome with exit 1, a bale error (nothing on stdout, a non-zero exit), stdout that is not one JSON object, a timeout, and one outcome bale never emits, spelled as no bale outcome is (twine-test-not-a-bale-outcome)"]
written_against = "0.4.45"
note = "the only apply argv twine builds (T12: twine.bale.dry_run_argv; never without --dry-run, never an admission or override flag). The recorded line's keys are outcome, sid, log, verdict, merge, telemetry, drift, checkpoint, required_checks, base_drift, archive, sweep; twine reads outcome and carries the object whole. Under --dry-run bale documents three answers (format_apply_json's docstring): dry-run (exit 0), one of the three *-refused outcomes (exit 1), or an error path with nothing on stdout and a non-zero exit. That is documented, not recorded: the tarball argument and the exit status of the recorded line stay unrecorded (fixtures/README.md), no refusal or error output is recorded, and doubles stand in until a recording probe captures them"

[[surface]]
kind = "verb"
verb = "relay"
flags = []
argv = ["relay", "<sid>", "-"]
cwd = "repo"
stdout = "the counterpart's paste block (an exchange block); '[bale] ' lines on stderr"
keys = []
read_by = ["carry exchange"]
stand_in = "fixtures/bale-0.4.45/crafter/--emit-block-stdin.txt"
doubles = ["tests/helpers.py StubBale and tests/test_carry_bale.py BaleDouble: relay's stdout after an ingest, a non-zero exit, a timeout"]
written_against = "0.4.45"
note = "stdin is exactly the exchange block's own lines (twine.shapes.block_text); twine passes stdout through as text and reads no key from it. No relay output is recorded: the stand-in is the crafter's --emit-block rendering, which TARBALL.md 5.9.2 pins byte-identical to relay's rendering of the same record. A recording of relay_sid_stdin.txt (and its exit code) replaces the stand-in and the doubles"

# --- text formats `twine take` reads (session 2026-10-02-twine-take-read-001) ---

[[surface]]
kind = "format"
format = "probe"
locator = "a fenced code block (``` or longer) whose first 5 lines include the header `# PROBE <slug>: …`"
home = "TARBALL.md §4.2; tools/craft_response.py PROBE_SCAFFOLD (--probe)"
emitted_by = ["tools/craft_response.py --probe <slug>, filled by a worker"]
fixtures = ["fixtures/bale-0.4.45/crafter/--probe-twine-take-fixture.txt"]
keys = []
read_by = ["carry probe", "take"]
written_against = "0.4.45"
note = "the crafter emits the bare script; a worker's turn carries it fenced, so tests wrap the fixture in a fence"

[[surface]]
kind = "format"
format = "probe-output"
locator = "`=== PROBE BEGIN <slug> ===` … `=== PROBE END <slug> ===`, trailer `--- integrity: N lines ---` as the last inner line"
home = "TARBALL.md §4.2; tools/craft_response.py PROBE_SCAFFOLD's emit_probe_block"
emitted_by = ["a probe built on the crafter's scaffold, run by the courier"]
fixtures = ["fixtures/bale-0.4.45/carried/probe-output_twine-take-specimens.txt"]
keys = []
read_by = ["carry probe", "take"]
written_against = "0.4.45"
note = "N counts the lines between BEGIN and the trailer (printf '%s\\n' \"$out\" | wc -l)"

[[surface]]
kind = "format"
format = "light"
locator = "`=== LIGHT BEGIN <sid> ===` … `=== LIGHT END <sid> ===`"
home = "TARBALL.md §5.10; tools/craft_response.py format_light_block (--light-block)"
emitted_by = ["tools/craft_response.py --light-block <file|->", "a worker by hand, per TARBALL.md §5.10"]
fixtures = ["fixtures/bale-0.4.45/crafter/--light-block-stdin.txt"]
keys = []
read_by = ["take"]
written_against = "0.4.45"
note = "no trailer by design; the four labels map onto question, context, default_assumption, why_blocked"

[[surface]]
kind = "format"
format = "exchange"
locator = "`BALE EXCHANGE BEGIN <sid>` … `BALE EXCHANGE END` (surrounding whitespace tolerated), trailer `# sha256 <hex>` as the last non-blank inner line"
home = "TARBALL.md §5.9.2; bin/bale_relay.py parse_exchange_input, _exchange_body_bytes, reescaped_body_matches, format_exchange_block"
emitted_by = ["bale relay <sid> <file|->", "tools/craft_response.py --emit-block <file|->"]
fixtures = ["fixtures/bale-0.4.45/crafter/--emit-block-stdin.txt"]
keys = ["round", "from"]
read_by = ["carry exchange", "take"]
written_against = "0.4.45"
note = "body = json.dumps(record, indent=2) + LF, ASCII-escaped; a body whose re-serialization matches the trailer though its bytes do not is the unescaped-in-transit fault (bale 0.4.41)"

[[surface]]
kind = "format"
format = "relay"
locator = "`=== RELAY BEGIN <sid> to <planner|worker> ===` … `=== RELAY END <sid> to <same> ===`"
home = "TARBALL.md §7; bin/bale_report.py relay_sentinels, _inline_lines, format_apply_relay_planner, format_hold_relay_planner, format_hold_relay_worker"
emitted_by = ["bale apply (a clean apply: to planner; a HOLD: to planner and to worker)"]
fixtures = ["fixtures/bale-0.4.45/carried/relay_2026-10-01-twine-seed-effort-003_to-planner.txt"]
keys = []
read_by = ["take"]
written_against = "0.4.45"
note = "no trailer; _inline_lines indents an inlined line that starts '=== RELAY ' by two spaces, so a sentinel is a column-0 line"

