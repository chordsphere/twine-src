# --- condition ---

[[mapping]]
provider = "anthropic"
on = "condition"
word = "socket-timeout"
stop = "timeout"
means = "the socket timed out before the provider answered, or mid-stream"

[[mapping]]
provider = "anthropic"
on = "condition"
word = "connection-error"
stop = "network-failure"
means = "the connection failed: refused, reset, a TLS error, a broken HTTP exchange"

[[mapping]]
provider = "anthropic"
on = "condition"
word = "stream-cut"
stop = "network-failure"
means = "the event stream ended before message_stop"

[[mapping]]
provider = "anthropic"
on = "condition"
word = "unclassified-stream-error"
stop = "network-failure"
means = "an SSE error event whose error.type no error_type row lists"

[[mapping]]
provider = "anthropic"
on = "condition"
word = "unlisted-stop-reason"
stop = "malformed-shape"
means = "a stop_reason no stop_reason row lists — a shape twine never asked for; the reason names the word"

[[mapping]]
provider = "anthropic"
on = "condition"
word = "unlisted-status"
stop = "malformed-shape"
means = "an HTTP status no status row lists; the reason names the status, never a guess at a nearer key"

[[mapping]]
provider = "anthropic"
on = "condition"
word = "malformed-body"
stop = "malformed-shape"
means = "a 200 whose body is not JSON or SSE, or not the documented shape: a message without content, stop_reason or usage, a content block of an unknown type, a usage the mapping refuses"
