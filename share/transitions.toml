# share/transitions.toml — twine's transition table (twine-seed.md D17).
#
# Every way a worker session or a worker turn can end, keyed on the closed
# vocabularies that name them, each with a declared move: what happens
# next and who does it. No default case — no wildcard, no fallback row, no
# catch-all key. Architect's requirement (D17), verbatim: "there shouldn't
# be any surprises, and every path taken should have a defined response."
#
# Landed by session 2026-10-03-twine-transitions-004 against bale 0.4.45;
# moved to bale 0.4.49 by session 2026-10-07-twine-pin-049-001, which
# re-read the three vocabularies (consumption manifest) and found every
# axis unchanged — no row here gained or lost a key. Session
# 2026-10-13-twine-runtime-anthropic-002 (Arc 2 R2) set `written_against` to
# the floor, 0.4.51 — the version the bale axes' vocabularies were last
# re-read at (pin-051), unchanged value for value since 0.4.45 — gave the
# stop axis its two provider keys (`request-refused`, `provider-error`) and
# its `loop_keys`, and wrote the first provider's mapping (Anthropic) as
# [[mapping]] rows at the foot of the file. Session
# 2026-10-13-twine-table-adapter-defect-007 gave the loop its fourth key,
# `adapter-defect` (a boundary refusal or an adapter that raised: twine's own
# defect, its move the operator's `fix-adapter`), and reconciled
# `continue-turn`'s description with the loop that performs it.
# twine/transitions.py loads and checks it; `twine transitions [--json]`
# renders it; tests/test_transitions.py fails by name on any key without a
# row. The table reads no bale install: its three bale axes take their
# keys from the [[vocabulary]] entries of share/bale-consumption.toml
# (twine's own record of bale's spellings, read by probe at the floor), and
# its fourth axis, `stop`, is twine's own vocabulary, declared here.
#
# Shape:
#   [table]          written_against: the bale version the bale axes' keys
#                    are spelled for (the manifest's floor: the version the
#                    vocabularies were re-read at)
#   [axis.<name>]    one per axis, in rendering order (`order`):
#                    source  "bale" — the keys are the consumption manifest's
#                                     [[vocabulary]] entry with this axis;
#                            "twine" — the keys are `keys`, below
#                    keys    (source = "twine" only) the vocabulary, in order
#                    loop_keys  (the `stop` axis only) the keys the loop
#                            produces and no model adapter may — the four it
#                            reports itself: `cap-reached` and `cap-unchecked`
#                            (the pre-call check refused the call), `killed`
#                            (the abort file) and `adapter-defect` (the
#                            adapter broke the boundary's contract or raised):
#                            a subset of `keys`; the boundary refuses a turn
#                            an adapter stops with one of them
#                    means   what a key on this axis names
#   [move.<name>]    one per move:
#                    actor        exactly one of "twine", "operator", "planner"
#                                 — who performs the move. Twine holds no
#                                 intent (N4): a move that needs a decision
#                                 names the planner or the operator. No move
#                                 has twine merge or apply anything (T12).
#                    description  one sentence: what happens next
#                    grounds      where the move comes from (a ruling, a doc)
#   [[row]]          one per (axis, key): axis, key, move, and `means` — what
#                    that key names, in a phrase.
#   [[mapping]]      a provider's word onto the stop axis — the only place a
#                    provider's word becomes twine's (runtime-contract §1.5):
#                    provider  the adapter's provider ("anthropic")
#                    on        what the word is: "stop_reason" (the message's
#                              stop_reason), "error_type" (an error body's or
#                              an SSE error event's error.type), "status" (an
#                              HTTP status, three digits), or "condition" — a
#                              condition twine names itself because the
#                              provider has no word for it (a socket timeout, a
#                              connection error, a stream cut short, an SSE
#                              error of a type no row lists, a stop_reason or
#                              an HTTP status no row lists, a body that is not
#                              the documented shape); every provider maps
#                              every condition
#                    word      the provider's spelling, verbatim
#                    stop      a key of the stop axis, never one of its
#                              loop_keys — or, instead of `stop`,
#                    continues = true: the turn goes on (it asked for tools)
#                    means     what the word names, in a phrase
#                    One mapping per (provider, on, word); `twine transitions`
#                    names every fault, and the adapter refuses to start on a
#                    table whose mapping for its provider has one.
#
# A pin bump re-reads the vocabularies into the manifest; a key bale adds
# then has no row here, and `twine transitions` says so by name until one
# is written (D4's mechanical diff, carried through to the moves).

[table]
written_against = "0.4.51"

# ---------------------------------------------------------------------------
# Axes
# ---------------------------------------------------------------------------

[axis.telemetry-outcome]
order = 1
source = "bale"
means = "the outcome bale records for a session event in its telemetry (schemas/telemetry-record.schema.json)"

[axis.closure-reason]
order = 2
source = "bale"
means = "why bale closed a session, stamped on unlock and revert (the same schema's closure_reason)"

[axis.apply-outcome]
order = 3
source = "bale"
means = "the outcome `bale apply --json` prints — what twine meets through `carry response`, which under T12 only ever sees dry-run, a *-refused, or an error path"

[axis.stop]
order = 4
source = "twine"
means = "how a worker turn stops on the API side of twine's runtime (Arc 2), in twine's own names: each model adapter's provider words map onto these through the [[mapping]] rows below (Anthropic's verified against the wire the architect recorded on 2026-10-13), never named in code"
keys = ["end-turn", "max-tokens", "model-refusal", "window-exhausted", "rate-limited", "overloaded", "network-failure", "timeout", "tool-error", "malformed-shape", "request-refused", "provider-error", "cap-reached", "killed", "cap-unchecked", "adapter-defect"]
loop_keys = ["cap-reached", "cap-unchecked", "killed", "adapter-defect"]

# ---------------------------------------------------------------------------
# Moves
# ---------------------------------------------------------------------------

# --- twine's: mechanical, no decision ---

[move.await-worker]
actor = "twine"
description = "Twine holds the session as in flight, waiting on the worker's response, with the silence timeout running so that nothing coming back becomes a no_response closure rather than a wait without end."
grounds = "D17 (silence gets timeouts and a no_response closure record); PLANNER.md §16, silence"

[move.record-closed]
actor = "twine"
description = "Twine records the session as finished in its in-flight state and carries nothing further for it; what the queue does next is the planner's."
grounds = "N4 (twine's durable state is the in-flight state of its table, never intent)"

[move.close-by-reason]
actor = "twine"
description = "Twine records the session as closed and takes the move of its closure-reason row, since bale reports `unlocked` for every registry close and the reason is what says why."
grounds = "telemetry schema: 'unlocked' is the registry-close outcome whatever command drove it"

[move.carry-to-planner]
actor = "twine"
description = "Twine carries the clarification's exchange block to the planner (`carry exchange`), and the session waits, suspended, for the answer round to come back the same way."
grounds = "TARBALL.md §5.9; PLANNER.md §15; D18"

[move.follow-successors]
actor = "twine"
description = "Twine records the session as closed and moves its in-flight state to the child sessions the split opened, which now carry the goal."
grounds = "bale pack --supersedes (the split-supersession closure); PLANNER.md §20"

[move.classify-final-text]
actor = "twine"
description = "Twine's courier classifies the turn's final text as one of bale's four shapes or as prose and carries it on, reading it exactly as `twine take` reads a paste."
grounds = "twine-seed.md §4.3, turn-end detection and shape classification"

[move.continue-turn]
actor = "twine"
description = "Twine continues the cut-off turn in a further call that carries what was written so far, counted against the window and the cap; at most three continuations in a row, past which the run stops with the stop the turn carried, max-tokens, for the planner to read."
grounds = "twine-seed.md §4.3, provider axis (max_tokens); PLANNER.md §16, bounded retries"

[move.retry-with-backoff]
actor = "twine"
description = "Twine retries the same call after a backoff, a bounded number of times; past the bound it stops the session and names the stop to the operator, never retrying without end."
grounds = "twine-seed.md §4.3, provider axis (rate limit and overload: retry with backoff); PLANNER.md §16, bounded retries"

[move.return-tool-error]
actor = "twine"
description = "Twine returns the error to the model as the tool's result and the turn goes on, so a tool error never ends the session."
grounds = "twine-seed.md §4.3, provider axis (tool error: returned as a result, never a crash)"

[move.close-aborted]
actor = "twine"
description = "Twine closes the killed session with the closure reason `aborted`, so a kill leaves a durable record and is never a mystery."
grounds = "D15 (a kill leaves a durable aborted-class closure record); bale 0.4.35's `aborted`"

# --- the operator's: running bale, reading what it says ---

[move.operator-applies]
actor = "operator"
description = "The operator reviews the clean dry run and runs the one `bale apply <path>` line twine handed back, because the merge is the operator's and twine never applies (T12)."
grounds = "T12; cli-contract.md §11.3"

[move.admit-or-return]
actor = "operator"
description = "The operator reads the refusal bale printed, admits each out-of-forecast path at an interactive `bale apply` when the worker enumerated it with a reason, or returns the work to the planner when it did not; twine never admits."
grounds = "AGENT.md §6, stay in the lane; D3's annotation (an orchestrator never admits)"

[move.diagnose-rejection]
actor = "operator"
description = "The operator reads the error bale wrote to stderr and the session log: a response that could not be applied as a response is closed `malformed_response` (whose own row is the next move), and an environmental fault is fixed and the apply run again."
grounds = "bin/bale_apply.py 3901-3905 ('rejected' = an error path); D17's malformed edge"

[move.re-carry-exchange]
actor = "operator"
description = "The operator, told that bale recorded no round, has the block's emitter re-emit it intact and carries it again, since twine relays only a block it can vouch for and never repairs one."
grounds = "cli-contract.md §11.2; bin/bale_relay.py 204-209 ('relay-refused')"

[move.stop-at-cap]
actor = "operator"
description = "The hard cap refused the call before it was made, so nothing more was spent; the operator decides whether to raise the cap or close the session, and in-flight work hands off as a bailout would."
grounds = "D15 (the hard cap refuses loudly; a cap breach has bailout semantics); Arc 1 session 5"

[move.fix-and-resume]
actor = "operator"
description = "The pre-call check could not run, so the call was not made and nothing was spent; the operator fixes the fault the refusal names — writes the missing price row, repairs the named stream line, names a state directory — and resumes the session, never by raising the cap."
grounds = "D15 (refuse loudly, never degrade silently); session 2026-10-03-twine-cost-spine-005's Proposal 'A stop key for a cap that cannot be checked', ratified at sitting 2026-10-03-continue-twine-006 (ruling 4)"

[move.fix-request]
actor = "operator"
description = "The provider refused the request itself — its shape, the credentials, the account or the model named — so nothing is retried; the operator is told the provider's error type and message and fixes the request or the credentials before the session is resumed or closed."
grounds = "Arc 2 R2's brief (e): HTTP 400, 401, 402, 403, 404, 409 and 413 — twine's request or credentials are wrong, nothing is retried"

[move.fix-adapter]
actor = "operator"
description = "The adapter broke the boundary's contract or raised on a call — twine's own defect, never a model outcome, and nothing of that call is in the spend stream — so the operator fixes the adapter and runs the session again on the same bundle (a second desk), or respawns it from the request; the planner is not asked."
grounds = "runtime-contract.md §1.6 (R1's promise of a row); session 2026-10-13-twine-runtime-run-004's Proposal 1; ruled at sitting 2026-10-13-open-milestone-2-006"

# --- the planner's: a decision about the work ---

[move.revert-and-repack]
actor = "planner"
description = "The planner triages the HOLD (PLANNER.md §14) and, for correctable work, has it reverted and repacks it with the failure context shipped — the to-worker relay block, never the to-planner one — and a `corrects:` pointer, amending at the desk instead when the wrongness traces to the spec or the oracle."
grounds = "D17, ratified: a well-formed HOLD gets revert and repack with the failure context shipped and `corrects:` lineage; PLANNER.md §14; T14"

[move.respawn-from-request]
actor = "planner"
description = "The planner respawns the work from the original request with a failure note the planner writes — never the failed worker's own account — within the retry bound, past which the goal is re-decomposed instead."
grounds = "D17, ratified: a malformed response gets respawn from the original request with a master-authored failure note; PLANNER.md §16; twine-seed.md §4.2"

[move.replan-after-backout]
actor = "planner"
description = "The planner decides whether the backed-out work is repacked with `corrects:` lineage or its session is closed, and twine carries nothing for it until then."
grounds = "PLANNER.md §14 and §16 (base-tree poisoning: revert plus the applied-tags lineage)"

[move.package-handoff]
actor = "planner"
description = "The planner packages the bailout's handoff into a fresh session (`bale handoff`), or re-decomposes the goal when bailouts cluster on the same work."
grounds = "AGENT.md §11.4 and §11.5; TARBALL.md §5.6"

[move.return-to-worker]
actor = "planner"
description = "The planner returns the refusal to the worker session, which re-ships its response under the same session with the required check declared, or amends the required-check pin when the pin is what is wrong."
grounds = "TARBALL.md §7 (a project may pin required check names; apply refuses an omission)"

[move.repack-on-new-base]
actor = "planner"
description = "The planner repacks the work against the current tip, because the base moved under the response and its whole-file overlay would revert the intervening edits."
grounds = "format_apply_json's docstring, base-drift-refused (board 41)"

[move.repack-reframed]
actor = "planner"
description = "The planner packs the goal as the clarification reframed it, as a new session."
grounds = "TARBALL.md §5.9.4; PLANNER.md §15"

[move.release-to-planner]
actor = "planner"
description = "The planner decides whether the closed session's goal returns to the queue, and in what shape."
grounds = "PLANNER.md §6, sitting practice; N4"

[move.reword-brief]
actor = "planner"
description = "The planner rewords the brief the model refused and repacks it, since twine never rephrases a request itself (N4)."
grounds = "D17's annotation: the 45-arc specimen, refused by the worker surface's safety classifier, landed in 46 minutes reworded"

[move.split-goal]
actor = "planner"
description = "The planner splits the goal at a seam and packs the first piece, because the goal did not fit one window and respawning it into the same window would fail the same way."
grounds = "AGENT.md §11.2 and §11.5; D17's annotation (exhaustion is an outcome, not a background event)"

