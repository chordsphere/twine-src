# ---------------------------------------------------------------------------
# Mappings — Anthropic's words onto the stop axis (Arc 2 R2; the Messages
# API as recorded on 2026-10-13: fixtures/anthropic/, runtime-contract §5).
# Read by twine.transitions.provider_mapping("anthropic"); the adapter's
# stop_key and error_key look words up here and spell no stop key in code.
# An HTTP error's status decides its key (the error_type rows are for SSE
# error events, which arrive inside a 200); the error.type and its message
# are kept in the turn's reason, never dispatched on.
# ---------------------------------------------------------------------------

# --- stop_reason ---

[[mapping]]
provider = "anthropic"
on = "stop_reason"
word = "end_turn"
stop = "end-turn"
means = "the model finished its turn"

[[mapping]]
provider = "anthropic"
on = "stop_reason"
word = "tool_use"
continues = true
means = "the model asked for tools: the turn goes on with their results"

[[mapping]]
provider = "anthropic"
on = "stop_reason"
word = "max_tokens"
stop = "max-tokens"
means = "the output reached max_tokens"

[[mapping]]
provider = "anthropic"
on = "stop_reason"
word = "refusal"
stop = "model-refusal"
means = "the model or its classifier refused (an HTTP 200; stop_details kept in the reason)"

[[mapping]]
provider = "anthropic"
on = "stop_reason"
word = "model_context_window_exceeded"
stop = "window-exhausted"
means = "the context window ran out"

[[mapping]]
provider = "anthropic"
on = "stop_reason"
word = "stop_sequence"
stop = "malformed-shape"
means = "a stop sequence matched — twine sends none, so a shape it never asked for"

[[mapping]]
provider = "anthropic"
on = "stop_reason"
word = "pause_turn"
stop = "malformed-shape"
means = "a server tool paused the turn — twine offers no server tools, so a shape it never asked for"

